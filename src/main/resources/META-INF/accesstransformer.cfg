# ---------------------------------------------------------------------------
# 仅为兼容 CraftTweaker 而加：CT 自带的 META-INF/crafttweaker_at.cfg 用的是 SRG 名，
# 而开发环境（MCP 名）里 FML 不会对 AT 条目做名字转换，于是 CT 在 dev 里会
# IllegalAccessError: LanguageMap.instance。这里把两条都写上：
#   - MCP 名（instance）   -> 开发环境生效
#   - SRG 名（field_74817_a）-> 生产环境生效（与 CT 自己的 AT 一致，幂等无害）
# ---------------------------------------------------------------------------
public net.minecraft.util.text.translation.LanguageMap instance # MCP 名（开发环境）
public net.minecraft.util.text.translation.LanguageMap field_74817_a # SRG 名（生产环境）
