# ============================================================================
#  NeoTreeOres — 统一构建配置（唯一配置源 / Single Source of Truth）
#  Minecraft 1.12.2 + Forge 14.23.5.2859
#  修改本文件即可，无需改动 build.gradle
# ============================================================================

# ---------------------------------------------------------------------------
#  工具链（Toolchain）—— 必须使用 JDK 8
#  说明：ForgeGradle 3 + Gradle 4.9 只能运行在 Java 8 上，系统默认 JDK 26 会直接失败。
#        请先把 JAVA_HOME 指向 JDK 8，再调用 gradlew。
# ---------------------------------------------------------------------------
org.gradle.java.home=C:/Program Files/Java/jdk1.8.0_501

# 反编译/打补丁需要足够内存
org.gradle.jvmargs=-Xmx3G
# 官方 MDK 策略：关闭常驻守护进程，避免旧 JVM 残留导致诡异问题
org.gradle.daemon=false

# ---------------------------------------------------------------------------
#  Minecraft / Forge 版本
#  forge_version 即"最低支持版本"：开发目标与运行期下限都用它
# ---------------------------------------------------------------------------
mc_version=1.12.2
forge_version=1.12.2-14.23.5.2859
forge_min_version=14.23.5.2859
mappings_channel=snapshot
mappings_version=20171003-1.12

# ---------------------------------------------------------------------------
#  Mod 元数据（会被注入 mcmod.info 与 jar manifest）
# ---------------------------------------------------------------------------
mod_id=neotreeores
mod_name=NeoTreeOres
mod_group=cn.mcmod.neotreeores
mod_version=1.0.0
mod_authors=NeoTreeOres Dev Team
mod_description=Adds a way to obtain mineral resources from trees to Minecraft.\nSupports adding oretrees via CrT!\nMost content requires manually adding recipes :D
mod_credits=MCMOD Modding Group
mod_url=
mod_update_url=
mod_logo_file=logo.png

# 主类全限定名（@Mod 入口）
mod_main_class=cn.mcmod.neotreeores.NeoTreeOres

# ---------------------------------------------------------------------------
#  构建变体
#    baked   = 预生成方块材质（一并随包发布 95 张彩色 PNG）
#    colored = 运行期用“灰度基底 + RGB”生成方块材质（发布包里不含那 95 张）
#  命令行覆盖： gradlew build -Pvariant=colored
#  注：两个变体的**物品**贴图一律随包发布，不做运行期生成。
# ---------------------------------------------------------------------------
# Single development artifact; no texture variants.
